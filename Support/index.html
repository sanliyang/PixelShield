<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术支持 | Support</title>
    <style>
        body {
            background-color: #000;
            color: #ccc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        h1 { color: #0f0; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        .card {
            border: 1px solid #333;
            padding: 40px;
            border-radius: 16px;
            background: #111;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 255, 0, 0.05);
        }
        p { margin-bottom: 15px; font-size: 16px; }
        .en { color: #777; font-size: 14px; margin-top: -10px; margin-bottom: 25px; }
        .email-box {
            margin-top: 30px;
            padding: 15px;
            background: #000;
            border: 1px dashed #444;
            border-radius: 8px;
        }
        a { color: #0f0; text-decoration: none; font-weight: bold; font-size: 18px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>PixelShield Support</h1>

    <div class="card">
        <p>如果您在使用过程中遇到任何问题，或有任何建议，欢迎随时联系我们。</p>
        <p class="en">If you encounter any issues or have any suggestions, please feel free to contact us.</p>

        <div class="email-box">
            <span style="color:#888; font-size:12px; display:block; margin-bottom:5px;">Email Us / 发邮件至</span>
            <!-- ⚠️ 请把下面的邮箱换成你的 -->
            <a href="mailto:lbylyr@gmail.com">lbylyr@gmail.com</a>
        </div>
    </div>
</body>
</html>
